<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruang Baca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <nav class="navbar navbar-expand-md navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Bantuan</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow border-0">
          <div class="card-body p-4">
            <h4 class="text-center fw-semibold mb-1">Masuk ke Ruang Baca</h4>
            <p class="text-center text-muted small mb-4">Temukan bacaan untuk hari ini.</p>
            <form>
              <div class="mb-3">
                <label for="username" class="form-label small">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Masukkan username">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label small">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Masukkan password">
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="ingat">
                <label class="form-check-label small" for="ingat">Ingat saya</label>
              </div>
              <button type="submit" class="btn btn-success w-100">Masuk</button>
            </form>
          </div>
          <div class="card-footer bg-light text-center py-3">
            <a href="#" class="link-success small">Lupa password?</a>
          </div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
